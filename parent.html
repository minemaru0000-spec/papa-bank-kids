<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>峯松証券 保護者画面</title>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--card-dark:#020617;--line:#475569;--text:#f8fafc;--sub:#cbd5e1;--blue:#2563eb;--cyan:#38bdf8;--green:#059669;--green-light:#34d399;--red:#e11d48;--gold:#f59e0b;--purple:#8b5cf6;--purple-light:#c4b5fd;}
    *{box-sizing:border-box;}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
    button,input,select,textarea{font:inherit;}button{cursor:pointer;border:0;}button:disabled{opacity:0.5;cursor:not-allowed;}input,select,textarea{user-select:text;-webkit-user-select:text;}
    .app{width:100%;max-width:760px;margin:0 auto;padding:18px 14px 70px;}.panel{margin-bottom:16px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card);}
    .login-panel{max-width:440px;margin:50px auto 0;text-align:center;}h1,h2,h3{margin-top:0;}h1{font-size:23px;}h2{margin-bottom:14px;font-size:18px;}
    .description{color:var(--sub);font-size:14px;line-height:1.7;}.password-input{width:100%;margin:12px 0;padding:15px;border:2px solid var(--line);border-radius:13px;outline:none;background:var(--card-dark);color:#fff;font-size:20px;letter-spacing:3px;text-align:center;}
    .password-input:focus{border-color:#60a5fa;}.remember-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 18px;color:var(--sub);font-size:14px;}
    .primary-button{width:100%;padding:14px;border-radius:13px;background:var(--blue);color:#fff;font-weight:bold;}.error{display:none;margin-top:14px;padding:12px;border:1px solid var(--red);border-radius:12px;color:#fecdd3;line-height:1.6;}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}.header-sub{margin-top:4px;color:var(--sub);font-size:12px;}
    .small-button{flex-shrink:0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#334155;color:#fff;font-weight:bold;}
    .status-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;padding:12px;border:1px solid var(--line);border-radius:13px;color:var(--sub);font-size:13px;}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px;}.summary-card{padding:13px 5px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:center;}
    .summary-label{color:var(--sub);font-size:11px;}.summary-value{margin-top:5px;font-size:19px;font-weight:bold;}.withdraw-color{color:var(--green-light);}.deposit-color{color:var(--purple-light);}
    .request-card{margin-bottom:12px;padding:15px;border:2px solid var(--line);border-radius:16px;}.withdraw-request{border-color:var(--green);background:rgba(16,185,129,0.09);}.deposit-request{border-color:var(--purple);background:rgba(139,92,246,0.1);}
    .request-type{display:inline-block;margin-bottom:9px;padding:5px 10px;border-radius:20px;color:#fff;font-size:12px;font-weight:bold;}.withdraw-type{background:var(--green);}.deposit-type{background:var(--purple);}
    .request-head{display:flex;justify-content:space-between;gap:12px;}.request-name{font-size:18px;font-weight:bold;}.request-date{margin-top:5px;color:var(--sub);font-size:12px;}.request-amount{font-size:21px;font-weight:bold;text-align:right;}
    .request-explanation{margin-top:12px;padding:9px;border-radius:10px;background:rgba(2,6,23,0.5);color:var(--sub);font-size:12px;line-height:1.6;}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
    .action-button{padding:13px;border-radius:12px;color:#fff;font-weight:bold;}.approve-withdraw{background:var(--green);}.approve-deposit{background:var(--purple);}.reject{background:var(--red);}
    .user-row,.history-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 2px;border-top:1px solid var(--line);}.user-row:first-child,.history-row:first-child{border-top:0;}
    .user-name{font-weight:bold;}.sub-text{margin-top:4px;color:var(--sub);font-size:12px;line-height:1.7;}.money{align-self:center;color:#7dd3fc;font-size:18px;font-weight:bold;text-align:right;}
    .history-side{text-align:right;}.history-type,.chip{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:bold;color:#fff;}.chip{background:#475569;}
    .approved-chip{background:#047857;}.rejected-chip{background:#be123c;}.pending-chip{background:#b45309;}.completed-chip{background:#0369a1;}.empty{padding:20px 8px;color:var(--sub);text-align:center;line-height:1.7;}.footer-link{display:block;margin-top:20px;color:#93c5fd;text-align:center;}
    .manual-panel{border:2px solid var(--gold);background:linear-gradient(145deg,rgba(245,158,11,0.1),var(--card));}.manual-notice{margin-bottom:16px;padding:11px;border:1px solid rgba(245,158,11,0.55);border-radius:12px;background:rgba(245,158,11,0.08);color:#fde68a;font-size:12px;line-height:1.7;}
    .form-group{margin-bottom:14px;}.form-label{display:block;margin-bottom:6px;color:var(--sub);font-size:13px;font-weight:bold;}.form-control{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;outline:none;background:var(--card-dark);color:#fff;}
    .form-control:focus{border-color:var(--cyan);}textarea.form-control{min-height:85px;resize:vertical;line-height:1.6;}.selected-balance{margin-bottom:14px;padding:13px;border-radius:12px;background:var(--card-dark);color:var(--sub);font-size:13px;line-height:1.8;text-align:center;}.selected-balance strong{color:var(--cyan);font-size:21px;}
    .manual-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.manual-button{padding:15px 8px;border-radius:13px;color:#fff;font-size:16px;font-weight:bold;}.manual-deposit-button{background:linear-gradient(135deg,#8b5cf6,#6d28d9);}.manual-withdraw-button{background:linear-gradient(135deg,#059669,#047857);}
    .manual-record{margin-bottom:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(2,6,23,0.45);}.manual-record-head{display:flex;justify-content:space-between;gap:10px;}
    .manual-record-type{display:inline-block;margin-bottom:7px;padding:4px 9px;border-radius:20px;color:#fff;font-size:11px;font-weight:bold;}.manual-deposit-type{background:var(--purple);}.manual-withdraw-type{background:var(--green);}.manual-record-detail{margin-top:10px;padding:9px;border-radius:9px;background:rgba(15,23,42,0.8);color:var(--sub);font-size:11px;line-height:1.7;overflow-wrap:anywhere;}
    .operation-id{margin-top:7px;color:#94a3b8;font-size:10px;overflow-wrap:anywhere;}.overlay{display:none;position:fixed;inset:0;z-index:999;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,23,0.85);}.loading{max-width:360px;padding:22px;border:2px solid #60a5fa;border-radius:16px;background:var(--card);font-weight:bold;line-height:1.7;text-align:center;}
    @media(max-width:560px){.summary{grid-template-columns:1fr 1fr;}.header h1{font-size:19px;}.manual-actions{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <main class="app">
    <section id="loginView" class="panel login-panel">
      <div style="font-size:48px;">🔐</div>
      <h1>保護者画面</h1>
      <p class="description">設定した暗証番号を入力してください。</p>
      <input id="passwordInput" class="password-input" type="password" placeholder="暗証番号" autocomplete="current-password">
      <label class="remember-row"><input id="rememberCheck" type="checkbox" style="width:20px;height:20px;">この端末に暗証番号を記憶する</label>
      <button id="loginButton" class="primary-button" type="button" onclick="login()">ログイン</button>
      <div id="loginError" class="error"></div>
      <a class="footer-link" href="./index.html">子ども画面へ戻る</a>
    </section>

    <section id="parentView" style="display:none;">
      <header class="header">
        <div><h1>👨‍👩‍👧 峯松証券 保護者画面</h1><div class="header-sub">入出金申請の処理・手動入出金</div></div>
        <button class="small-button" type="button" onclick="logout()">ログアウト</button>
      </header>
      <div class="status-bar"><span id="updateStatus">読み込み中</span><button class="small-button" type="button" onclick="loadParentData()">🔄 更新</button></div>

      <div class="summary">
        <div class="summary-card"><div class="summary-label">登録人数</div><div id="userCount" class="summary-value">0人</div></div>
        <div class="summary-card"><div class="summary-label">残高合計</div><div id="totalCash" class="summary-value">0円</div></div>
        <div class="summary-card"><div class="summary-label">出金申請中</div><div id="pendingWithdrawalCount" class="summary-value withdraw-color">0件</div></div>
        <div class="summary-card"><div class="summary-label">入金申請中</div><div id="pendingDepositCount" class="summary-value deposit-color">0件</div></div>
      </div>

      <section class="panel"><h2>📬 承認待ちの入出金申請</h2><div id="pendingContainer"></div></section>

      <section class="panel manual-panel">
        <h2>🧾 保護者による手動入金・手動出金</h2>
        <div class="manual-notice">この操作は子どもの申請を経由せず残高へ即座に反映されます。</div>
        <div class="form-group"><label class="form-label" for="manualUserSelect">対象ユーザー</label><select id="manualUserSelect" class="form-control" onchange="updateSelectedUserBalance()"><option value="">選択してください</option></select></div>
        <div id="selectedUserBalance" class="selected-balance">対象ユーザーを選択してください</div>
        <div class="form-group"><label class="form-label" for="manualAmount">金額</label><input id="manualAmount" class="form-control" type="number" inputmode="numeric" min="1" max="1000000" step="1" placeholder="1円～1,000,000円"></div>
        <div class="form-group"><label class="form-label" for="manualMemo">理由・メモ</label><textarea id="manualMemo" class="form-control" maxlength="100" placeholder="例：お手伝い報酬、誕生日、訂正"></textarea></div>
        <div class="manual-actions">
          <button class="manual-button manual-withdraw-button" type="button" onclick="confirmManualTransaction('withdrawal')">🏧 手動出金</button>
          <button class="manual-button manual-deposit-button" type="button" onclick="confirmManualTransaction('deposit')">💴 手動入金</button>
        </div>
      </section>

      <section class="panel"><h2>🏦 ユーザー残高</h2><div id="usersContainer"></div></section>
      <section class="panel"><h2>🧾 最近の手動入出金</h2><div id="manualHistoryContainer"></div></section>
      <section class="panel"><h2>📋 最近の入出金申請</h2><div id="historyContainer"></div></section>
      <a class="footer-link" href="./index.html">子ども画面へ戻る</a>
    </section>
  </main>

  <div id="overlay" class="overlay"><div id="loadingText" class="loading">処理中...</div></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxHXhW4qe6pWMHCgMlQi-2o3rk-3oVnxlUP9FTVD-tev_kpGzriSSQcq8DOyaHQvQZH/exec";
    const STORAGE_KEY = "minematsu_parent_password";
    let parentPassword = "", processing = false, currentUsers = [];

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        parentPassword = saved;
        document.getElementById("rememberCheck").checked = true;
        autoLogin();
      }
    });

    async function callApi(action, data) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({}, data || {}, { action, parentPassword })),
        redirect
