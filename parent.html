<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>峯松証券 保護者画面</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-dark: #020617;
      --line: #475569;
      --text: #f8fafc;
      --sub: #cbd5e1;
      --blue: #2563eb;
      --cyan: #38bdf8;
      --green: #059669;
      --green-light: #34d399;
      --red: #e11d48;
      --gold: #f59e0b;
      --purple: #8b5cf6;
      --purple-light: #c4b5fd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 70px;
    }

    .panel {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
    }

    .login-panel {
      max-width: 440px;
      margin: 50px auto 0;
      text-align: center;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    h1 {
      font-size: 23px;
    }

    h2 {
      margin-bottom: 14px;
      font-size: 18px;
    }

    .description {
      color: var(--sub);
      font-size: 14px;
      line-height: 1.7;
    }

    .password-input {
      width: 100%;
      margin: 12px 0;
      padding: 15px;
      border: 2px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: var(--card-dark);
      color: white;
      font-size: 20px;
      letter-spacing: 3px;
      text-align: center;
    }

    .password-input:focus {
      border-color: #60a5fa;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 18px;
      color: var(--sub);
      font-size: 14px;
    }

    .remember-row input {
      width: 20px;
      height: 20px;
    }

    .primary-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font-weight: bold;
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--red);
      border-radius: 12px;
      color: #fecdd3;
      line-height: 1.6;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
    }

    .header-sub {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
    }

    .small-button {
      flex-shrink: 0;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #334155;
      color: white;
      font-weight: bold;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--sub);
      font-size: 13px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }

    .summary-card {
      padding: 13px 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      text-align: center;
    }

    .summary-label {
      color: var(--sub);
      font-size: 11px;
    }

    .summary-value {
      margin-top: 5px;
      font-size: 19px;
      font-weight: bold;
    }

    .withdraw-color {
      color: var(--green-light);
    }

    .deposit-color {
      color: var(--purple-light);
    }

    .request-card {
      margin-bottom: 12px;
      padding: 15px;
      border: 2px solid var(--line);
      border-radius: 16px;
    }

    .withdraw-request {
      border-color: var(--green);
      background: rgba(16,185,129,0.09);
    }

    .deposit-request {
      border-color: var(--purple);
      background: rgba(139,92,246,0.1);
    }

    .request-type {
      display: inline-block;
      margin-bottom: 9px;
      padding: 5px 10px;
      border-radius: 20px;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .withdraw-type {
      background: var(--green);
    }

    .deposit-type {
      background: var(--purple);
    }

    .request-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .request-name {
      font-size: 18px;
      font-weight: bold;
    }

    .request-date {
      margin-top: 5px;
      color: var(--sub);
      font-size: 12px;
    }

    .request-amount {
      font-size: 21px;
      font-weight: bold;
      text-align: right;
    }

    .withdraw-amount {
      color: var(--green-light);
    }

    .deposit-amount {
      color: var(--purple-light);
    }

    .request-explanation {
      margin-top: 12px;
      padding: 9px;
      border-radius: 10px;
      background: rgba(2,6,23,0.5);
      color: var(--sub);
      font-size: 12px;
      line-height: 1.6;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .action-button {
      padding: 13px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }

    .approve-withdraw {
      background: var(--green);
    }

    .approve-deposit {
      background: var(--purple);
    }

    .reject {
      background: var(--red);
    }

    .user-row,
    .history-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 13px 2px;
      border-top: 1px solid var(--line);
    }

    .user-row:first-child,
    .history-row:first-child {
      border-top: 0;
    }

    .user-name {
      font-weight: bold;
    }

    .sub-text {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.7;
    }

    .money {
      align-self: center;
      color: #7dd3fc;
      font-size: 18px;
      font-weight: bold;
      text-align: right;
    }

    .history-side {
      text-align: right;
    }

    .history-type {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      color: white;
      font-size: 11px;
      font-weight: bold;
    }

    .chip {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #475569;
      font-size: 11px;
    }

    .approved-chip {
      background: #047857;
    }

    .rejected-chip {
      background: #be123c;
    }

    .pending-chip {
      background: #b45309;
    }

    .cancelled-chip {
      background: #475569;
    }

    .empty {
      padding: 20px 8px;
      color: var(--sub);
      text-align: center;
      line-height: 1.7;
    }

    .footer-link {
      display: block;
      margin-top: 20px;
      color: #93c5fd;
      text-align: center;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2,6,23,0.85);
    }

    .loading {
      padding: 22px;
      border: 2px solid #60a5fa;
      border-radius: 16px;
      background: var(--card);
      font-weight: bold;
      text-align: center;
    }

    @media (max-width: 560px) {
      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .summary-value {
        font-size: 17px;
      }

      .request-head {
        align-items: flex-start;
      }

      .request-amount {
        font-size: 19px;
      }

      .header h1 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section
      id="loginView"
      class="panel login-panel"
    >
      <div style="font-size:48px;">
        🔐
      </div>

      <h1>保護者画面</h1>

      <p class="description">
        設定した8桁の暗証番号を入力してください。
      </p>

      <input
        id="passwordInput"
        class="password-input"
        type="password"
        inputmode="numeric"
        maxlength="8"
        placeholder="8桁の暗証番号"
        autocomplete="current-password"
      >

      <label class="remember-row">
        <input
          id="rememberCheck"
          type="checkbox"
        >
        この端末に暗証番号を記憶する
      </label>

      <button
        id="loginButton"
        class="primary-button"
        type="button"
        onclick="login()"
      >
        ログイン
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

      <a
        class="footer-link"
        href="./index.html"
      >
        子ども画面へ戻る
      </a>
    </section>

    <section
      id="parentView"
      style="display:none;"
    >
      <header class="header">
        <div>
          <h1>
            👨‍👩‍👧 峯松証券 保護者画面
          </h1>

          <div class="header-sub">
            入金・出金申請の確認、承認、却下
          </div>
        </div>

        <button
          class="small-button"
          type="button"
          onclick="logout()"
        >
          ログアウト
        </button>
      </header>

      <div class="status-bar">
        <span id="updateStatus">
          読み込み中
        </span>

        <button
          class="small-button"
          type="button"
          onclick="loadParentData()"
        >
          🔄 更新
        </button>
      </div>

      <div class="summary">
        <div class="summary-card">
          <div class="summary-label">
            登録人数
          </div>

          <div
            id="userCount"
            class="summary-value"
          >
            0人
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            残高合計
          </div>

          <div
            id="totalCash"
            class="summary-value"
          >
            0円
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            出金申請中
          </div>

          <div
            id="pendingWithdrawalCount"
            class="summary-value withdraw-color"
          >
            0件
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            入金申請中
          </div>

          <div
            id="pendingDepositCount"
            class="summary-value deposit-color"
          >
            0件
          </div>
        </div>
      </div>

      <section class="panel">
        <h2>
          📬 承認待ちの入出金申請
        </h2>

        <div id="pendingContainer"></div>
      </section>

      <section class="panel">
        <h2>
          🏦 ユーザー残高
        </h2>

        <div id="usersContainer"></div>
      </section>

      <section class="panel">
        <h2>
          📋 最近の入出金申請
        </h2>

        <div id="historyContainer"></div>
      </section>

      <a
        class="footer-link"
        href="./index.html"
      >
        子ども画面へ戻る
      </a>
    </section>
  </main>

  <div
    id="overlay"
    class="overlay"
  >
    <div
      id="loadingText"
      class="loading"
    >
      処理中...
    </div>
  </div>

  <script>
    var API_URL =
      "https://script.google.com/macros/s/AKfycbxHXhW4qe6pWMHCgMlQi-2o3rk-3oVnxlUP9FTVD-tev_kpGzriSSQcq8DOyaHQvQZH/exec";

    var STORAGE_KEY =
      "minematsu_parent_password";

    var parentPassword = "";
    var processing = false;

    document.addEventListener(
      "DOMContentLoaded",
      function() {
        var passwordInput =
          document.getElementById(
            "passwordInput"
          );

        passwordInput.addEventListener(
          "keydown",
          function(event) {
            if (event.key === "Enter") {
              login();
            }
          }
        );

        var savedPassword =
          localStorage.getItem(
            STORAGE_KEY
          );

        if (savedPassword) {
          parentPassword =
            savedPassword;

          document.getElementById(
            "rememberCheck"
          ).checked = true;

          autoLogin();
        }
      }
    );

    async function callApi(
      action,
      data
    ) {
      var body = Object.assign(
        {},
        data || {},
        {
          action: action,
          parentPassword:
            parentPassword
        }
      );

      var response =
        await fetch(
          API_URL,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },
            body: JSON.stringify(body),
            redirect: "follow"
          }
        );

      if (!response.ok) {
        throw new Error(
          "通信に失敗しました（HTTP " +
          response.status +
          "）"
        );
      }

      var text =
        await response.text();

      var result;

      try {
        result = JSON.parse(text);

      } catch (error) {
        throw new Error(
          "サーバーの返答を読み取れませんでした。"
        );
      }

      if (
        !result ||
        result.status !== "success"
      ) {
        throw new Error(
          result && result.message
            ? result.message
            : "処理に失敗しました。"
        );
      }

      return result;
    }

    async function autoLogin() {
      setProcessing(
        true,
        "自動ログイン中..."
      );

      try {
        var data =
          await callApi(
            "getParentData"
          );

        openParentView();
        render(data);

      } catch (error) {
        localStorage.removeItem(
          STORAGE_KEY
        );

        parentPassword = "";

        document.getElementById(
          "rememberCheck"
        ).checked = false;

        showError(
          "保存された暗証番号が使えません。" +
          "もう一度入力してください。"
        );

      } finally {
        setProcessing(false);
      }
    }

    async function login() {
      if (processing) {
        return;
      }

      var input =
        document.getElementById(
          "passwordInput"
        );

      var password =
        input.value.trim();

      if (!/^\d{8}$/.test(password)) {
        showError(
          "8桁の数字を入力してください。"
        );

        return;
      }

      parentPassword =
        password;

      hideError();

      setProcessing(
        true,
        "暗証番号を確認中..."
      );

      try {
        var data =
          await callApi(
            "getParentData"
          );

        if (
          document.getElementById(
            "rememberCheck"
          ).checked
        ) {
          localStorage.setItem(
            STORAGE_KEY,
            parentPassword
          );

        } else {
          localStorage.removeItem(
            STORAGE_KEY
          );
        }

        input.value = "";

        openParentView();
        render(data);

      } catch (error) {
        parentPassword = "";
        showError(
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }

    function openParentView() {
      document.getElementById(
        "loginView"
      ).style.display = "none";

      document.getElementById(
        "parentView"
      ).style.display = "block";
    }

    async function loadParentData() {
      if (processing) {
        return;
      }

      setProcessing(
        true,
        "最新データを読み込み中..."
      );

      try {
        var data =
          await callApi(
            "getParentData"
          );

        render(data);

      } catch (error) {
        alert(
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }

    function render(data) {
      var users =
        Array.isArray(data.users)
          ? data.users
          : [];

      var pending =
        Array.isArray(
          data.pendingRequests
        )
          ? data.pendingRequests
          : [];

      var history =
        Array.isArray(data.requests)
          ? data.requests
          : [];

      var pendingWithdrawals =
        pending.filter(
          function(request) {
            return (
              getRequestType(request) ===
              "出金申請"
            );
          }
        );

      var pendingDeposits =
        pending.filter(
          function(request) {
            return (
              getRequestType(request) ===
              "入金申請"
            );
          }
        );

      var totalCash =
        users.reduce(
          function(sum, user) {
            return (
              sum +
              (
                Number(user.cash) ||
                0
              )
            );
          },
          0
        );

      document.getElementById(
        "userCount"
      ).textContent =
        users.length + "人";

      document.getElementById(
        "totalCash"
      ).textContent =
        yen(totalCash);

      document.getElementById(
        "pendingWithdrawalCount"
      ).textContent =
        pendingWithdrawals.length +
        "件";

      document.getElementById(
        "pendingDepositCount"
      ).textContent =
        pendingDeposits.length +
        "件";

      document.getElementById(
        "updateStatus"
      ).textContent =
        "最終更新：" +
        new Date().toLocaleTimeString(
          "ja-JP"
        );

      renderPending(pending);
      renderUsers(users);
      renderHistory(history);
    }

    function getRequestType(request) {
      if (
        request &&
        request.type === "入金申請"
      ) {
        return "入金申請";
      }

      return "出金申請";
    }

    function renderPending(requests) {
      var container =
        document.getElementById(
          "pendingContainer"
        );

      if (requests.length === 0) {
        container.innerHTML =
          '<div class="empty">' +
          "承認待ちの申請はありません。" +
          "</div>";

        return;
      }

      container.innerHTML =
        requests.map(
          function(request) {
            var type =
              getRequestType(request);

            var isDeposit =
              type === "入金申請";

            var cardClass =
              isDeposit
                ? "deposit-request"
                : "withdraw-request";

            var typeClass =
              isDeposit
                ? "deposit-type"
                : "withdraw-type";

            var amountClass =
              isDeposit
                ? "deposit-amount"
                : "withdraw-amount";

            var approveClass =
              isDeposit
                ? "approve-deposit"
                : "approve-withdraw";

            var approveAction =
              isDeposit
                ? "approveDepositRequest"
                : "approveWithdrawalRequest";

            var rejectAction =
              isDeposit
                ? "rejectDepositRequest"
                : "rejectWithdrawalRequest";

            var typeIcon =
              isDeposit
                ? "💴"
                : "🏧";

            var explanation =
              isDeposit
                ? "承認すると、パパ銀行残高へこの金額を追加します。"
                : "承認すると、パパ銀行残高からこの金額を差し引きます。";

            return (
              '<article class="request-card ' +
                cardClass +
              '">' +

                '<div class="request-type ' +
                  typeClass +
                '">' +
                  typeIcon +
                  " " +
                  escapeHtml(type) +
                "</div>" +

                '<div class="request-head">' +
                  "<div>" +
                    '<div class="request-name">' +
                      escapeHtml(
                        request.userName
                      ) +
                      "さん" +
                    "</div>" +

                    '<div class="request-date">' +
                      escapeHtml(
                        request.date
                      ) +
                    "</div>" +
                  "</div>" +

                  '<div class="request-amount ' +
                    amountClass +
                  '">' +
                    (
                      isDeposit
                        ? "＋"
                        : "－"
                    ) +
                    yen(request.amount) +
                  "</div>" +
                "</div>" +

                '<div class="request-explanation">' +
                  escapeHtml(
                    explanation
                  ) +
                "</div>" +

                '<div class="actions">' +
                  '<button class="action-button reject"' +
                    ' data-action="' +
                      escapeHtml(
                        rejectAction
                      ) +
                    '"' +
                    ' data-request-id="' +
                      escapeHtml(
                        request.requestId
                      ) +
                    '"' +
                    ' data-user-name="' +
                      escapeHtml(
                        request.userName
                      ) +
                    '"' +
                    ' data-amount="' +
                      Number(
                        request.amount
                      ) +
                    '"' +
                    ' data-type="' +
                      escapeHtml(type) +
                    '"' +
                    ' onclick="confirmRequestFromButton(this)">' +
                    "却下する" +
                  "</button>" +

                  '<button class="action-button ' +
                    approveClass +
                  '"' +
                    ' data-action="' +
                      escapeHtml(
                        approveAction
                      ) +
                    '"' +
                    ' data-request-id="' +
                      escapeHtml(
                        request.requestId
                      ) +
                    '"' +
                    ' data-user-name="' +
                      escapeHtml(
                        request.userName
                      ) +
                    '"' +
                    ' data-amount="' +
                      Number(
                        request.amount
                      ) +
                    '"' +
                    ' data-type="' +
                      escapeHtml(type) +
                    '"' +
                    ' onclick="confirmRequestFromButton(this)">' +
                    "承認する" +
                  "</button>" +
                "</div>" +
              "</article>"
            );
          }
        ).join("");
    }

    function renderUsers(users) {
      var container =
        document.getElementById(
          "usersContainer"
        );

      if (users.length === 0) {
        container.innerHTML =
          '<div class="empty">' +
          "ユーザーがいません。" +
          "</div>";

        return;
      }

      container.innerHTML =
        users.map(
          function(user) {
            var pendingWithdrawal =
              Number(
                user.pendingWithdrawal
              ) || 0;

            var pendingDeposit =
              Number(
                user.pendingDeposit
              ) || 0;

            var availableCash =
              Number(
                user.availableCash
              );

            if (
              !Number.isFinite(
                availableCash
              )
            ) {
              availableCash =
                Math.max(
                  0,
                  (
                    Number(user.cash) ||
                    0
                  ) -
                  pendingWithdrawal
                );
            }

            return (
              '<div class="user-row">' +
                "<div>" +
                  '<div class="user-name">' +
                    escapeHtml(
                      user.name
                    ) +
                  "</div>" +

                  '<div class="sub-text">' +
                    "利用可能：" +
                    yen(availableCash) +
                    "<br>" +

                    '<span class="withdraw-color">' +
                      "出金申請中：" +
                      yen(
                        pendingWithdrawal
                      ) +
                    "</span>" +
                    "<br>" +

                    '<span class="deposit-color">' +
                      "入金申請中：" +
                      yen(
                        pendingDeposit
                      ) +
                    "</span>" +
                  "</div>" +
                "</div>" +

                '<div class="money">' +
                  yen(user.cash) +
                "</div>" +
              "</div>"
            );
          }
        ).join("");
    }

    function renderHistory(requests) {
      var container =
        document.getElementById(
          "historyContainer"
        );

      if (requests.length === 0) {
        container.innerHTML =
          '<div class="empty">' +
          "申請履歴はありません。" +
          "</div>";

        return;
      }

      container.innerHTML =
        requests
          .slice(0, 30)
          .map(
            function(request) {
              var type =
                getRequestType(request);

              var isDeposit =
                type === "入金申請";

              var typeClass =
                isDeposit
                  ? "deposit-type"
                  : "withdraw-type";

              var amountColor =
                isDeposit
                  ? "#c4b5fd"
                  : "#34d399";

              return (
                '<div class="history-row">' +
                  "<div>" +
                    '<div class="user-name">' +
                      escapeHtml(
                        request.userName
                      ) +
                      "さん" +
                    "</div>" +

                    '<div class="sub-text">' +
                      escapeHtml(
                        request.date
                      ) +
                    "</div>" +

                    '<span class="history-type ' +
                      typeClass +
                    '">' +
                      escapeHtml(type) +
                    "</span>" +
                  "</div>" +

                  '<div class="history-side">' +
                    '<div class="money" style="color:' +
                      amountColor +
                    ';">' +
                      (
                        isDeposit
                          ? "＋"
                          : "－"
                      ) +
                      yen(
                        request.amount
                      ) +
                    "</div>" +

                    '<span class="chip ' +
                      statusClass(
                        request.status
                      ) +
                    '">' +
                      escapeHtml(
                        request.status
                      ) +
                    "</span>" +
                  "</div>" +
                "</div>"
              );
            }
          ).join("");
    }

    function confirmRequestFromButton(
      button
    ) {
      var action =
        button.getAttribute(
          "data-action"
        ) || "";

      var requestId =
        button.getAttribute(
          "data-request-id"
        ) || "";

      var userName =
        button.getAttribute(
          "data-user-name"
        ) || "";

      var amount =
        Number(
          button.getAttribute(
            "data-amount"
          )
        ) || 0;

      var type =
        button.getAttribute(
          "data-type"
        ) || "出金申請";

      confirmRequest(
        action,
        requestId,
        userName,
        amount,
        type
      );
    }

    function confirmRequest(
      action,
      requestId,
      userName,
      amount,
      type
    ) {
      if (processing) {
        return;
      }

      var isApprove =
        action ===
          "approveWithdrawalRequest" ||
        action ===
          "approveDepositRequest";

      var isDeposit =
        type === "入金申請";

      var message;

      if (isApprove && isDeposit) {
        message =
          userName +
          "さんの入金申請 " +
          yen(amount) +
          "を承認しますか？\n\n" +
          "承認すると、パパ銀行残高へ" +
          yen(amount) +
          "追加されます。";

      } else if (
        isApprove &&
        !isDeposit
      ) {
        message =
          userName +
          "さんの出金申請 " +
          yen(amount) +
          "を承認しますか？\n\n" +
          "承認すると、パパ銀行残高から" +
          yen(amount) +
          "差し引かれます。";

      } else {
        message =
          userName +
          "さんの" +
          type +
          " " +
          yen(amount) +
          "を却下しますか？\n\n" +
          "残高は変更されません。";
      }

      if (confirm(message)) {
        processRequest(
          action,
          requestId,
          isApprove
            ? "承認"
            : "却下"
        );
      }
    }

    async function processRequest(
      action,
      requestId,
      label
    ) {
      if (processing) {
        return;
      }

      setProcessing(
        true,
        label + "処理中..."
      );

      try {
        var result =
          await callApi(
            action,
            {
              requestId: requestId
            }
          );

        alert(result.message);

        var data =
          await callApi(
            "getParentData"
          );

        render(data);

      } catch (error) {
        alert(
          label +
          "できませんでした。\n\n" +
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }

    function logout() {
      if (processing) {
        return;
      }

      localStorage.removeItem(
        STORAGE_KEY
      );

      parentPassword = "";

      document.getElementById(
        "parentView"
      ).style.display = "none";

      document.getElementById(
        "loginView"
      ).style.display = "block";

      document.getElementById(
        "rememberCheck"
      ).checked = false;

      document.getElementById(
        "passwordInput"
      ).value = "";

      hideError();
    }

    function setProcessing(
      active,
      text
    ) {
      processing = active;

      var overlay =
        document.getElementById(
          "overlay"
        );

      document.getElementById(
        "loadingText"
      ).textContent =
        text || "処理中...";

      overlay.style.display =
        active
          ? "flex"
          : "none";
    }

    function showError(message) {
      var errorBox =
        document.getElementById(
          "loginError"
        );

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";
    }

    function hideError() {
      document.getElementById(
        "loginError"
      ).style.display =
        "none";
    }

    function statusClass(status) {
      if (status === "承認済み") {
        return "approved-chip";
      }

      if (status === "却下") {
        return "rejected-chip";
      }

      if (status === "取消済み") {
        return "cancelled-chip";
      }

      if (status === "申請中") {
        return "pending-chip";
      }

      return "";
    }

    function yen(value) {
      return (
        (
          Number(value) || 0
        ).toLocaleString(
          "ja-JP"
        ) +
        "円"
      );
    }

    function getErrorMessage(error) {
      return (
        error && error.message
          ? error.message
          : String(error)
      );
    }

    function escapeHtml(value) {
      return String(
        value == null ? "" : value
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
