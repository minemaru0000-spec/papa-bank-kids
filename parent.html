<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>峯松証券 保護者画面</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-dark: #020617;
      --line: #475569;
      --text: #f8fafc;
      --sub: #cbd5e1;
      --blue: #2563eb;
      --cyan: #38bdf8;
      --green: #059669;
      --green-light: #34d399;
      --red: #e11d48;
      --red-light: #fb7185;
      --gold: #f59e0b;
      --purple: #8b5cf6;
      --purple-light: #c4b5fd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input,
    select,
    textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 70px;
    }

    .panel {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
    }

    .login-panel {
      max-width: 440px;
      margin: 50px auto 0;
      text-align: center;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    h1 {
      font-size: 23px;
    }

    h2 {
      margin-bottom: 14px;
      font-size: 18px;
    }

    h3 {
      font-size: 16px;
    }

    .description {
      color: var(--sub);
      font-size: 14px;
      line-height: 1.7;
    }

    .password-input {
      width: 100%;
      margin: 12px 0;
      padding: 15px;
      border: 2px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: var(--card-dark);
      color: white;
      font-size: 20px;
      letter-spacing: 3px;
      text-align: center;
    }

    .password-input:focus {
      border-color: #60a5fa;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 18px;
      color: var(--sub);
      font-size: 14px;
    }

    .remember-row input {
      width: 20px;
      height: 20px;
    }

    .primary-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font-weight: bold;
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--red);
      border-radius: 12px;
      color: #fecdd3;
      line-height: 1.6;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
    }

    .header-sub {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
    }

    .small-button {
      flex-shrink: 0;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #334155;
      color: white;
      font-weight: bold;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--sub);
      font-size: 13px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }

    .summary-card {
      padding: 13px 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      text-align: center;
    }

    .summary-label {
      color: var(--sub);
      font-size: 11px;
    }

    .summary-value {
      margin-top: 5px;
      font-size: 19px;
      font-weight: bold;
    }

    .withdraw-color {
      color: var(--green-light);
    }

    .deposit-color {
      color: var(--purple-light);
    }

    .request-card {
      margin-bottom: 12px;
      padding: 15px;
      border: 2px solid var(--line);
      border-radius: 16px;
    }

    .withdraw-request {
      border-color: var(--green);
      background: rgba(16, 185, 129, 0.09);
    }

    .deposit-request {
      border-color: var(--purple);
      background: rgba(139, 92, 246, 0.1);
    }

    .request-type {
      display: inline-block;
      margin-bottom: 9px;
      padding: 5px 10px;
      border-radius: 20px;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .withdraw-type {
      background: var(--green);
    }

    .deposit-type {
      background: var(--purple);
    }

    .request-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .request-name {
      font-size: 18px;
      font-weight: bold;
    }

    .request-date {
      margin-top: 5px;
      color: var(--sub);
      font-size: 12px;
    }

    .request-amount {
      font-size: 21px;
      font-weight: bold;
      text-align: right;
    }

    .withdraw-amount {
      color: var(--green-light);
    }

    .deposit-amount {
      color: var(--purple-light);
    }

    .request-explanation {
      margin-top: 12px;
      padding: 9px;
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.5);
      color: var(--sub);
      font-size: 12px;
      line-height: 1.6;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .action-button {
      padding: 13px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }

    .approve-withdraw {
      background: var(--green);
    }

    .approve-deposit {
      background: var(--purple);
    }

    .reject {
      background: var(--red);
    }

    .user-row,
    .history-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 13px 2px;
      border-top: 1px solid var(--line);
    }

    .user-row:first-child,
    .history-row:first-child {
      border-top: 0;
    }

    .user-name {
      font-weight: bold;
    }

    .sub-text {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.7;
    }

    .money {
      align-self: center;
      color: #7dd3fc;
      font-size: 18px;
      font-weight: bold;
      text-align: right;
    }

    .history-side {
      text-align: right;
    }

    .history-type {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      color: white;
      font-size: 11px;
      font-weight: bold;
    }

    .chip {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #475569;
      font-size: 11px;
    }

    .approved-chip {
      background: #047857;
    }

    .rejected-chip {
      background: #be123c;
    }

    .pending-chip {
      background: #b45309;
    }

    .cancelled-chip {
      background: #475569;
    }

    .completed-chip {
      background: #0369a1;
    }

    .empty {
      padding: 20px 8px;
      color: var(--sub);
      text-align: center;
      line-height: 1.7;
    }

    .footer-link {
      display: block;
      margin-top: 20px;
      color: #93c5fd;
      text-align: center;
    }

    /* ======================================================
       手動入出金
       ====================================================== */

    .manual-panel {
      border: 2px solid var(--gold);
      background:
        linear-gradient(
          145deg,
          rgba(245, 158, 11, 0.1),
          var(--card)
        );
    }

    .manual-notice {
      margin-bottom: 16px;
      padding: 11px;
      border: 1px solid rgba(245, 158, 11, 0.55);
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.08);
      color: #fde68a;
      font-size: 12px;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      color: var(--sub);
      font-size: 13px;
      font-weight: bold;
    }

    .form-control {
      width: 100%;
      padding: 13px;
      border: 2px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: var(--card-dark);
      color: white;
    }

    .form-control:focus {
      border-color: var(--cyan);
    }

    textarea.form-control {
      min-height: 85px;
      resize: vertical;
      line-height: 1.6;
    }

    .selected-balance {
      margin-bottom: 14px;
      padding: 13px;
      border-radius: 12px;
      background: var(--card-dark);
      color: var(--sub);
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }

    .selected-balance strong {
      color: var(--cyan);
      font-size: 21px;
    }

    .manual-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .manual-button {
      padding: 15px 8px;
      border: 0;
      border-radius: 13px;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .manual-deposit-button {
      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #6d28d9
        );
    }

    .manual-withdraw-button {
      background:
        linear-gradient(
          135deg,
          #059669,
          #047857
        );
    }

    .manual-record {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.45);
    }

    .manual-record-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .manual-record-type {
      display: inline-block;
      margin-bottom: 7px;
      padding: 4px 9px;
      border-radius: 20px;
      color: white;
      font-size: 11px;
      font-weight: bold;
    }

    .manual-deposit-type {
      background: var(--purple);
    }

    .manual-withdraw-type {
      background: var(--green);
    }

    .manual-record-detail {
      margin-top: 10px;
      padding: 9px;
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.8);
      color: var(--sub);
      font-size: 11px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .operation-id {
      margin-top: 7px;
      color: #94a3b8;
      font-size: 10px;
      overflow-wrap: anywhere;
    }

    /* ======================================================
       オーバーレイ
       ====================================================== */

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.85);
    }

    .loading {
      max-width: 360px;
      padding: 22px;
      border: 2px solid #60a5fa;
      border-radius: 16px;
      background: var(--card);
      font-weight: bold;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 560px) {
      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .summary-value {
        font-size: 17px;
      }

      .request-head {
        align-items: flex-start;
      }

      .request-amount {
        font-size: 19px;
      }

      .header h1 {
        font-size: 19px;
      }

      .manual-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- ====================================================
         ログイン画面
         ==================================================== -->

    <section
      id="loginView"
      class="panel login-panel"
    >
      <div style="font-size:48px;">
        🔐
      </div>

      <h1>保護者画面</h1>

      <p class="description">
        設定した8桁の暗証番号を入力してください。
      </p>

      <input
        id="passwordInput"
        class="password-input"
        type="password"
        inputmode="numeric"
        maxlength="8"
        placeholder="8桁の暗証番号"
        autocomplete="current-password"
      >

      <label class="remember-row">
        <input
          id="rememberCheck"
          type="checkbox"
        >
        この端末に暗証番号を記憶する
      </label>

      <button
        id="loginButton"
        class="primary-button"
        type="button"
        onclick="login()"
      >
        ログイン
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

      <a
        class="footer-link"
        href="./index.html"
      >
        子ども画面へ戻る
      </a>
    </section>

    <!-- ====================================================
         保護者画面
         ==================================================== -->

    <section
      id="parentView"
      style="display:none;"
    >
      <header class="header">
        <div>
          <h1>
            👨‍👩‍👧 峯松証券 保護者画面
          </h1>

          <div class="header-sub">
            入出金申請の処理・手動入金・手動出金
          </div>
        </div>

        <button
          class="small-button"
          type="button"
          onclick="logout()"
        >
          ログアウト
        </button>
      </header>

      <div class="status-bar">
        <span id="updateStatus">
          読み込み中
        </span>

        <button
          class="small-button"
          type="button"
          onclick="loadParentData()"
        >
          🔄 更新
        </button>
      </div>

      <!-- 集計 -->

      <div class="summary">
        <div class="summary-card">
          <div class="summary-label">
            登録人数
          </div>

          <div
            id="userCount"
            class="summary-value"
          >
            0人
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            残高合計
          </div>

          <div
            id="totalCash"
            class="summary-value"
          >
            0円
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            出金申請中
          </div>

          <div
            id="pendingWithdrawalCount"
            class="summary-value withdraw-color"
          >
            0件
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            入金申請中
          </div>

          <div
            id="pendingDepositCount"
            class="summary-value deposit-color"
          >
            0件
          </div>
        </div>
      </div>

      <!-- 承認待ち -->

      <section class="panel">
        <h2>
          📬 承認待ちの入出金申請
        </h2>

        <div id="pendingContainer"></div>
      </section>

      <!-- 手動入出金 -->

      <section class="panel manual-panel">
        <h2>
          🧾 保護者による手動入金・手動出金
        </h2>

        <div class="manual-notice">
          この操作は子どもの申請を経由せず、残高へすぐ反映されます。
          処理した日時、金額、理由、処理前残高、処理後残高を
          「取引履歴」へ保存します。
        </div>

        <div class="form-group">
          <label
            class="form-label"
            for="manualUserSelect"
          >
            対象ユーザー
          </label>

          <select
            id="manualUserSelect"
            class="form-control"
            onchange="updateSelectedUserBalance()"
          >
            <option value="">
              ユーザーを選択してください
            </option>
          </select>
        </div>

        <div
          id="selectedUserBalance"
          class="selected-balance"
        >
          対象ユーザーを選択してください
        </div>

        <div class="form-group">
          <label
            class="form-label"
            for="manualAmount"
          >
            金額
          </label>

          <input
            id="manualAmount"
            class="form-control"
            type="number"
            inputmode="numeric"
            min="1"
            max="1000000"
            step="1"
            placeholder="1円～1,000,000円"
          >
        </div>

        <div class="form-group">
          <label
            class="form-label"
            for="manualMemo"
          >
            理由・メモ
          </label>

          <textarea
            id="manualMemo"
            class="form-control"
            maxlength="100"
            placeholder="例：お手伝いの報酬、誕生日のお金、入力訂正"
          ></textarea>
        </div>

        <div class="manual-actions">
          <button
            class="manual-button manual-withdraw-button"
            type="button"
            onclick="confirmManualTransaction('withdrawal')"
          >
            🏧 手動出金
          </button>

          <button
            class="manual-button manual-deposit-button"
            type="button"
            onclick="confirmManualTransaction('deposit')"
          >
            💴 手動入金
          </button>
        </div>
      </section>

      <!-- ユーザー残高 -->

      <section class="panel">
        <h2>
          🏦 ユーザー残高
        </h2>

        <div id="usersContainer"></div>
      </section>

      <!-- 手動入出金履歴 -->

      <section class="panel">
        <h2>
          🧾 最近の手動入出金
        </h2>

        <div id="manualHistoryContainer"></div>
      </section>

      <!-- 申請履歴 -->

      <section class="panel">
        <h2>
          📋 最近の入出金申請
        </h2>

        <div id="historyContainer"></div>
      </section>

      <a
        class="footer-link"
        href="./index.html"
      >
        子ども画面へ戻る
      </a>
    </section>
  </main>

  <!-- 処理中表示 -->

  <div
    id="overlay"
    class="overlay"
  >
    <div
      id="loadingText"
      class="loading"
    >
      処理中...
    </div>
  </div>

  <script>
    var API_URL =
      "https://script.google.com/macros/s/AKfycbxHXhW4qe6pWMHCgMlQi-2o3rk-3oVnxlUP9FTVD-tev_kpGzriSSQcq8DOyaHQvQZH/exec";

    var STORAGE_KEY =
      "minematsu_parent_password";

    var parentPassword = "";
    var processing = false;
    var currentUsers = [];


    // ======================================================
    // 起動
    // ======================================================

    document.addEventListener(
      "DOMContentLoaded",
      function() {
        var passwordInput =
          document.getElementById(
            "passwordInput"
          );

        passwordInput.addEventListener(
          "keydown",
          function(event) {
            if (event.key === "Enter") {
              login();
            }
          }
        );

        var savedPassword =
          localStorage.getItem(
            STORAGE_KEY
          );

        if (savedPassword) {
          parentPassword =
            savedPassword;

          document.getElementById(
            "rememberCheck"
          ).checked = true;

          autoLogin();
        }
      }
    );


    // ======================================================
    // API
    // ======================================================

    async function callApi(
      action,
      data
    ) {
      var body = Object.assign(
        {},
        data || {},
        {
          action: action,
          parentPassword:
            parentPassword
        }
      );

      var response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(body),

            redirect:
              "follow"
          }
        );

      if (!response.ok) {
        throw new Error(
          "通信に失敗しました（HTTP " +
          response.status +
          "）"
        );
      }

      var text =
        await response.text();

      var result;

      try {
        result =
          JSON.parse(text);

      } catch (error) {
        throw new Error(
          "サーバーの返答を読み取れませんでした。"
        );
      }

      if (
        !result ||
        result.status !== "success"
      ) {
        throw new Error(
          result && result.message
            ? result.message
            : "処理に失敗しました。"
        );
      }

      return result;
    }


    // ======================================================
    // ログイン
    // ======================================================

    async function autoLogin() {
      if (processing) {
        return;
      }

      setProcessing(
        true,
        "自動ログイン中..."
      );

      try {
        var data =
          await callApi(
            "getParentData"
          );

        openParentView();
        render(data);

      } catch (error) {
        localStorage.removeItem(
          STORAGE_KEY
        );

        parentPassword = "";

        document.getElementById(
          "rememberCheck"
        ).checked = false;

        showError(
          "保存された暗証番号が使えません。" +
          "もう一度入力してください。"
        );

      } finally {
        setProcessing(false);
      }
    }


    async function login() {
      if (processing) {
        return;
      }

      var input =
        document.getElementById(
          "passwordInput"
        );

      var password =
        input.value.trim();

      if (!/^\d{8}$/.test(password)) {
        showError(
          "8桁の数字を入力してください。"
        );

        return;
      }

      parentPassword =
        password;

      hideError();

      setProcessing(
        true,
        "暗証番号を確認中..."
      );

      try {
        var data =
          await callApi(
            "getParentData"
          );

        if (
          document.getElementById(
            "rememberCheck"
          ).checked
        ) {
          localStorage.setItem(
            STORAGE_KEY,
            parentPassword
          );

        } else {
          localStorage.removeItem(
            STORAGE_KEY
          );
        }

        input.value = "";

        openParentView();
        render(data);

      } catch (error) {
        parentPassword = "";

        showError(
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }

    // ======================================================
    // 全体描画
    // ======================================================

    function render(data) {
      var users =
        Array.isArray(data.users)
          ? data.users
          : [];

      var pending =
        Array.isArray(
          data.pendingRequests
        )
          ? data.pendingRequests
          : [];

      var history =
        Array.isArray(data.requests)
          ? data.requests
          : [];

      var manualTransactions =
        Array.isArray(
          data.manualTransactions
        )
          ? data.manualTransactions
          : [];

      currentUsers = users;

      var pendingWithdrawals =
        pending.filter(
          function(request) {
            return (
              getRequestType(request) ===
              "出金申請"
            );
          }
        );

      var pendingDeposits =
        pending.filter(
          function(request) {
            return (
              getRequestType(request) ===
              "入金申請"
            );
          }
        );

      var totalCash =
        users.reduce(
          function(sum, user) {
            return (
              sum +
              (
                Number(user.cash) ||
                0
              )
            );
          },
          0
        );

      document.getElementById(
        "userCount"
      ).textContent =
        users.length + "人";

      document.getElementById(
        "totalCash"
      ).textContent =
        yen(totalCash);

      document.getElementById(
        "pendingWithdrawalCount"
      ).textContent =
        pendingWithdrawals.length +
        "件";

      document.getElementById(
        "pendingDepositCount"
      ).textContent =
        pendingDeposits.length +
        "件";

      document.getElementById(
        "updateStatus"
      ).textContent =
        "最終更新：" +
        new Date().toLocaleTimeString(
          "ja-JP"
        );

      renderPending(pending);
      renderUsers(users);
      renderManualUserOptions(users);
      renderManualHistory(
        manualTransactions
      );
      renderHistory(history);
    }

    // 承認待ち申請

      if (
        request &&
        request.type === "入金申請"
      ) {
        return "入金申請";
      }

      return "出金申請";
    }

    function confirmRequestFromButton(
      button
    ) {
      var action =
        button.getAttribute(
          "data-action"
        ) || "";

      var requestId =
        button.getAttribute(
          "data-request-id"
        ) || "";

      var userName =
        button.getAttribute(
          "data-user-name"
        ) || "";

      var amount =
        Number(
          button.getAttribute(
            "data-amount"
          )
        ) || 0;

      var type =
        button.getAttribute(
          "data-type"
        ) || "出金申請";

      confirmRequest(
        action,
        requestId,
        userName,
        amount,
        type
      );
    }


    function confirmRequest(
      action,
      requestId,
      userName,
      amount,
      type
    ) {
      if (processing) {
        return;
      }

      var isApprove =
        action ===
          "approveWithdrawalRequest" ||
        action ===
          "approveDepositRequest";

      var isDeposit =
        type === "入金申請";

      var message;

      if (
        isApprove &&
        isDeposit
      ) {
        message =
          userName +
          "さんの入金申請 " +
          yen(amount) +
          "を承認しますか？\n\n" +
          "承認すると、パパ銀行残高へ" +
          yen(amount) +
          "追加されます。";

      } else if (
        isApprove &&
        !isDeposit
      ) {
        message =
          userName +
          "さんの出金申請 " +
          yen(amount) +
          "を承認しますか？\n\n" +
          "承認すると、パパ銀行残高から" +
          yen(amount) +
          "差し引かれます。";

      } else {
        message =
          userName +
          "さんの" +
          type +
          " " +
          yen(amount) +
          "を却下しますか？\n\n" +
          "残高は変更されません。";
      }

      if (confirm(message)) {
        processRequest(
          action,
          requestId,
          isApprove
            ? "承認"
            : "却下"
        );
      }
    }


    async function processRequest(
      action,
      requestId,
      label
    ) {
      if (processing) {
        return;
      }

      setProcessing(
        true,
        label + "処理中..."
      );

      try {
        var result =
          await callApi(
            action,
            {
              requestId:
                requestId
            }
          );

        alert(result.message);

        var data =
          await callApi(
            "getParentData"
          );

        render(data);

      } catch (error) {
        alert(
          label +
          "できませんでした。\n\n" +
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }

    // ======================================================

    function renderManualUserOptions(
      users
    ) {
      var select =
        document.getElementById(
          "manualUserSelect"
        );

      var previousValue =
        select.value;

      var html =
        '<option value="">' +
        "ユーザーを選択してください" +
        "</option>";

      for (
        var i = 0;
        i < users.length;
        i++
      ) {
        html +=
          '<option value="' +
          escapeHtml(
            users[i].name
          ) +
          '">' +
          escapeHtml(
            users[i].name
          ) +
          "（残高 " +
          yen(users[i].cash) +
          "）" +
          "</option>";
      }

      select.innerHTML = html;

      var exists =
        users.some(
          function(user) {
            return (
              user.name ===
              previousValue
            );
          }
        );

      if (exists) {
        select.value =
          previousValue;
      }

      updateSelectedUserBalance();
    }


    function findCurrentUser(
      userName
    ) {
      for (
        var i = 0;
        i < currentUsers.length;
        i++
      ) {
        if (
          currentUsers[i].name ===
          userName
        ) {
          return currentUsers[i];
        }
      }

      return null;
    }


    function updateSelectedUserBalance() {
      var userName =
        document.getElementById(
          "manualUserSelect"
        ).value;

      var box =
        document.getElementById(
          "selectedUserBalance"
        );

      if (!userName) {
        box.innerHTML =
          "対象ユーザーを選択してください";

        return;
      }

      var user =
        findCurrentUser(userName);

      if (!user) {
        box.innerHTML =
          "ユーザー情報を取得できません。";

        return;
      }

      var cash =
        Number(user.cash) || 0;

      var pendingWithdrawal =
        Number(
          user.pendingWithdrawal
        ) || 0;

      var availableCash =
        Number(
          user.availableCash
        );

      if (
        !Number.isFinite(
          availableCash
        )
      ) {
        availableCash =
          Math.max(
            0,
            cash -
            pendingWithdrawal
          );
      }

      box.innerHTML =
        escapeHtml(user.name) +
        "さんの現在残高<br>" +
        "<strong>" +
        yen(cash) +
        "</strong><br>" +
        "手動出金できる上限：" +
        yen(availableCash);
    }


    function getManualFormData() {
      var userName =
        document.getElementById(
          "manualUserSelect"
        ).value.trim();

      var amountValue =
        document.getElementById(
          "manualAmount"
        ).value;

      var amount =
        Number(amountValue);

      var memo =
        document.getElementById(
          "manualMemo"
        ).value.trim();

      if (!userName) {
        throw new Error(
          "対象ユーザーを選択してください。"
        );
      }

      if (
        !Number.isFinite(amount) ||
        !Number.isInteger(amount) ||
        amount <= 0
      ) {
        throw new Error(
          "金額は1円以上の整数で入力してください。"
        );
      }

      if (amount > 1000000) {
        throw new Error(
          "1回の手動入出金は100万円以下にしてください。"
        );
      }

      if (!memo) {
        throw new Error(
          "理由・メモを入力してください。"
        );
      }

      if (memo.length > 100) {
        throw new Error(
          "理由・メモは100文字以内で入力してください。"
        );
      }

      var user =
        findCurrentUser(userName);

      if (!user) {
        throw new Error(
          "対象ユーザーの最新情報を取得できません。"
        );
      }

      return {
        userName: userName,
        amount: amount,
        memo: memo,
        user: user
      };
    }


    function confirmManualTransaction(
      type
    ) {
      if (processing) {
        return;
      }

      var formData;

      try {
        formData =
          getManualFormData();

      } catch (error) {
        alert(
          getErrorMessage(error)
        );

        return;
      }

      var isDeposit =
        type === "deposit";

      var cash =
        Number(
          formData.user.cash
        ) || 0;

      var pendingWithdrawal =
        Number(
          formData.user
            .pendingWithdrawal
        ) || 0;

      var availableCash =
        Number(
          formData.user
            .availableCash
        );

      if (
        !Number.isFinite(
          availableCash
        )
      ) {
        availableCash =
          Math.max(
            0,
            cash -
            pendingWithdrawal
          );
      }

      if (
        !isDeposit &&
        formData.amount >
          availableCash
      ) {
        alert(
          "手動出金額が利用可能額を超えています。\n\n" +
          "現在残高：" +
          yen(cash) +
          "\n" +
          "出金申請中：" +
          yen(pendingWithdrawal) +
          "\n" +
          "手動出金できる上限：" +
          yen(availableCash)
        );

        return;
      }

      var afterCash =
        isDeposit
          ? cash + formData.amount
          : cash - formData.amount;

      var actionName =
        isDeposit
          ? "手動入金"
          : "手動出金";

      var sign =
        isDeposit
          ? "＋"
          : "－";

      var message =
        formData.userName +
        "さんへ、次の" +
        actionName +
        "を実行しますか？\n\n" +

        "金額：" +
        sign +
        yen(formData.amount) +
        "\n" +

        "理由：" +
        formData.memo +
        "\n\n" +

        "処理前残高：" +
        yen(cash) +
        "\n" +

        "処理後残高：" +
        yen(afterCash) +
        "\n\n" +

        "実行すると残高へすぐ反映されます。";

      if (!confirm(message)) {
        return;
      }

      processManualTransaction(
        type,
        formData
      );
    }


    async function processManualTransaction(
      type,
      formData
    ) {
      if (processing) {
        return;
      }

      var action =
        type === "deposit"
          ? "manualDeposit"
          : "manualWithdrawal";

      var actionName =
        type === "deposit"
          ? "手動入金"
          : "手動出金";

      var operationId =
        createOperationId();

      setProcessing(
        true,
        actionName + "を処理中..."
      );

      try {
        var result =
          await callApi(
            action,
            {
              userName:
                formData.userName,

              amount:
                formData.amount,

              memo:
                formData.memo,

              operationId:
                operationId
            }
          );

        alert(
          result.message +
          "\n\n" +
          "処理前残高：" +
          yen(result.beforeCash) +
          "\n" +
          "処理後残高：" +
          yen(result.afterCash)
        );

        clearManualForm();

        var data =
          await callApi(
            "getParentData"
          );

        render(data);

      } catch (error) {
        alert(
          actionName +
          "できませんでした。\n\n" +
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }


    function createOperationId() {
      var randomPart = "";

      if (
        window.crypto &&
        window.crypto.getRandomValues
      ) {
        var values =
          new Uint32Array(3);

        window.crypto.getRandomValues(
          values
        );

        randomPart =
          Array.from(values)
            .map(
              function(value) {
                return value.toString(16);
              }
            )
            .join("");

      } else {
        randomPart =
          Math.random()
            .toString(36)
            .slice(2) +
          Math.random()
            .toString(36)
            .slice(2);
      }

      return (
        "MAN-" +
        Date.now().toString(36) +
        "-" +
        randomPart
      );
    }

    }

                    "</span>" +
                  "</div>" +

                  '<div class="history-side">' +
                    '<div class="money" style="color:' +
                      amountColor +
                    ';">' +
                      (
                        isDeposit
                          ? "＋"
                          : "－"
                      ) +
                      yen(
                        request.amount
                      ) +
                    "</div>" +

                    '<span class="chip ' +
                      statusClass(
                        request.status
                      ) +
                    '">' +
                      escapeHtml(
                        request.status
                      ) +
                    "</span>" +
                  "</div>" +
                "</div>"
              );
            }
          ).join("");
    }


    // ======================================================
    // 共通表示処理
    // ======================================================

    function setProcessing(
      active,
      text
    ) {
      processing = active;

      var overlay =
        document.getElementById(
          "overlay"
        );

      document.getElementById(
        "loadingText"
      ).textContent =
        text || "処理中...";

      overlay.style.display =
        active
          ? "flex"
          : "none";
    }


    function showError(message) {
      var errorBox =
        document.getElementById(
          "loginError"
        );

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";
    }


    function hideError() {
      document.getElementById(
        "loginError"
      ).style.display =
        "none";
    }


    function statusClass(status) {
      if (status === "承認済み") {
        return "approved-chip";
      }

      if (status === "却下") {
        return "rejected-chip";
      }

      if (status === "取消済み") {
        return "cancelled-chip";
      }

      if (status === "申請中") {
        return "pending-chip";
      }

      if (status === "完了") {
        return "completed-chip";
      }

      return "";
    }


    function yen(value) {
      return (
        (
          Number(value) || 0
        ).toLocaleString(
          "ja-JP"
        ) +
        "円"
      );
    }


    function getErrorMessage(error) {
      return (
        error && error.message
          ? error.message
          : String(error)
      );
    }


    function escapeHtml(value) {
      return String(
        value == null ? "" : value
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
