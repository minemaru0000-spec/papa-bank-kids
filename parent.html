<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >
  <meta name="robots" content="noindex,nofollow">
  <title>峯松証券 保護者画面</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --line: rgba(255,255,255,0.12);
      --text: #f8fafc;
      --sub: #cbd5e1;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #f43f5e;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 14px 80px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: 23px;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
    }

    .small-button {
      flex-shrink: 0;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #334155;
      color: #fff;
      font-weight: bold;
    }

    .panel {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
    }

    .panel-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 900;
    }

    .login-panel {
      max-width: 440px;
      margin: 60px auto 0;
      text-align: center;
    }

    .password-input {
      display: block;
      width: 100%;
      margin: 18px 0 12px;
      padding: 14px;
      border: 2px solid #475569;
      border-radius: 14px;
      outline: none;
      background: #0f172a;
      color: #fff;
      font-size: 18px;
      user-select: text;
    }

    .password-input:focus {
      border-color: #60a5fa;
    }

    .primary-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: var(--blue);
      color: #fff;
      font-size: 17px;
      font-weight: 900;
    }

    .primary-button:disabled,
    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--red);
      border-radius: 12px;
      background: rgba(244,63,94,0.12);
      color: #fecdd3;
      font-size: 14px;
      line-height: 1.6;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      color: var(--sub);
      font-size: 13px;
    }

    .reload-button {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 0;
      border-radius: 10px;
      background: rgba(59,130,246,0.2);
      color: #93c5fd;
      font-weight: bold;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      padding: 15px 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      text-align: center;
    }

    .summary-label {
      color: var(--sub);
      font-size: 11px;
    }

    .summary-value {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 900;
    }

    .pending-value {
      color: var(--gold);
    }

    .user-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 15px;
      border-top: 1px solid var(--line);
    }

    .user-card:first-of-type {
      border-top: 0;
    }

    .user-name {
      font-size: 17px;
      font-weight: 900;
    }

    .user-sub {
      margin-top: 5px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.6;
    }

    .user-cash {
      align-self: center;
      color: #7dd3fc;
      font-size: 20px;
      font-weight: 900;
      text-align: right;
    }

    .request-card {
      margin-bottom: 12px;
      padding: 16px;
      border: 2px solid var(--gold);
      border-radius: 18px;
      background: rgba(245,158,11,0.08);
    }

    .request-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .request-user {
      font-size: 18px;
      font-weight: 900;
    }

    .request-amount {
      color: #fbbf24;
      font-size: 22px;
      font-weight: 900;
      text-align: right;
    }

    .request-date {
      color: var(--sub);
      font-size: 12px;
    }

    .request-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .action-button {
      padding: 13px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
    }

    .reject-button {
      background: var(--red);
    }

    .approve-button {
      background: var(--green);
    }

    .history-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px 4px;
      border-top: 1px solid var(--line);
    }

    .history-row:first-of-type {
      border-top: 0;
    }

    .history-main {
      font-size: 14px;
      font-weight: bold;
    }

    .history-sub {
      margin-top: 4px;
      color: var(--sub);
      font-size: 11px;
    }

    .history-right {
      text-align: right;
    }

    .history-amount {
      font-weight: 900;
    }

    .status-chip {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #475569;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
    }

    .status-approved {
      background: #047857;
    }

    .status-rejected {
      background: #be123c;
    }

    .status-pending {
      background: #b45309;
    }

    .empty {
      padding: 24px 12px;
      color: var(--sub);
      text-align: center;
      line-height: 1.7;
    }

    .footer-link {
      display: block;
      margin-top: 22px;
      color: #93c5fd;
      font-size: 13px;
      text-align: center;
    }

    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2,6,23,0.82);
    }

    .loading-box {
      padding: 22px 28px;
      border: 2px solid #60a5fa;
      border-radius: 18px;
      background: var(--card);
      font-weight: 900;
      text-align: center;
    }

    @media (max-width: 480px) {
      .summary-value {
        font-size: 18px;
      }

      .summary-card {
        padding-right: 4px;
        padding-left: 4px;
      }

      .request-head {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section id="loginView" class="panel login-panel">
      <div style="font-size:48px;">🔐</div>

      <h1 class="title" style="margin-top:8px;">
        保護者画面
      </h1>

      <p style="color:var(--sub);font-size:14px;line-height:1.7;">
        GASの実行ログで控えた<br>
        保護者用パスワードを入力してください。
      </p>

      <input
        id="passwordInput"
        class="password-input"
        type="password"
        placeholder="保護者用パスワード"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        class="primary-button"
        type="button"
        onclick="login()"
      >
        ログイン
      </button>

      <div id="loginError" class="error"></div>

      <a class="footer-link" href="./index.html">
        子ども画面へ戻る
      </a>
    </section>

    <section id="parentView" style="display:none;">
      <header class="header">
        <div>
          <h1 class="title">👨‍👩‍👧 峯松証券 保護者画面</h1>

          <div class="subtitle">
            出金申請の確認・承認・却下
          </div>
        </div>

        <button
          class="small-button"
          type="button"
          onclick="logout()"
        >
          ログアウト
        </button>
      </header>

      <div class="status-bar">
        <span id="updateStatus">データを読み込みました</span>

        <button
          id="reloadButton"
          class="reload-button"
          type="button"
          onclick="loadParentData()"
        >
          🔄 更新
        </button>
      </div>

      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-label">登録人数</div>
          <div id="userCount" class="summary-value">0人</div>
        </div>

        <div class="summary-card">
          <div class="summary-label">銀行残高合計</div>
          <div id="totalCash" class="summary-value">0円</div>
        </div>

        <div class="summary-card">
          <div class="summary-label">申請中</div>
          <div
            id="pendingCount"
            class="summary-value pending-value"
          >
            0件
          </div>
        </div>
      </div>

      <section class="panel">
        <h2 class="panel-title">🏧 承認待ちの出金申請</h2>

        <div id="pendingContainer">
          <div class="empty">読み込み中...</div>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">🏦 ユーザー残高</h2>

        <div id="usersContainer">
          <div class="empty">読み込み中...</div>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">📋 最近の出金申請</h2>

        <div id="historyContainer">
          <div class="empty">読み込み中...</div>
        </div>
      </section>

      <a class="footer-link" href="./index.html">
        子ども画面へ戻る
      </a>
    </section>
  </main>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box" id="loadingMessage">
      処理中...
    </div>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxHXhW4qe6pWMHCgMlQi-2o3rk-3oVnxlUP9FTVD-tev_kpGzriSSQcq8DOyaHQvQZH/exec";

    let parentPassword = "";
    let processing = false;

    window.addEventListener(
      "DOMContentLoaded",
      function() {
        document
          .getElementById("passwordInput")
          .addEventListener(
            "keydown",
            function(event) {
              if (event.key === "Enter") {
                login();
              }
            }
          );
      }
    );

    async function callApi(action, data = {}) {
      const requestData = Object.assign(
        {},
        data,
        {
          action: action,
          parentPassword: parentPassword
        }
      );

      const response = await fetch(
        API_URL,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body: JSON.stringify(requestData),
          redirect: "follow"
        }
      );

      if (!response.ok) {
        throw new Error(
          "通信に失敗しました（HTTP " +
          response.status +
          "）"
        );
      }

      const text = await response.text();
      let result;

      try {
        result = JSON.parse(text);
      } catch (error) {
        throw new Error(
          "サーバーから正しいデータが返りませんでした。"
        );
      }

      if (
        !result ||
        result.status !== "success"
      ) {
        throw new Error(
          result && result.message
            ? result.message
            : "処理に失敗しました。"
        );
      }

      return result;
    }

    async function login() {
      if (processing) {
        return;
      }

      const input =
        document.getElementById(
          "passwordInput"
        );

      const password = input.value.trim();

      if (!password) {
        showLoginError(
          "パスワードを入力してください。"
        );
        return;
      }

      parentPassword = password;
      hideLoginError();
      setProcessing(true, "確認中...");

      try {
        const data = await callApi(
          "getParentData"
        );

        document.getElementById(
          "loginView"
        ).style.display = "none";

        document.getElementById(
          "parentView"
        ).style.display = "block";

        input.value = "";
        renderParentData(data);

      } catch (error) {
        parentPassword = "";

        showLoginError(
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }

    async function loadParentData() {
      if (!parentPassword || processing) {
        return;
      }

      setProcessing(
        true,
        "最新データを読み込み中..."
      );

      try {
        const data = await callApi(
          "getParentData"
        );

        renderParentData(data);

      } catch (error) {
        alert(
          "読み込みエラー\n\n" +
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }

    function renderParentData(data) {
      const users =
        Array.isArray(data.users)
          ? data.users
          : [];

      const pendingRequests =
        Array.isArray(data.pendingRequests)
          ? data.pendingRequests
          : [];

      const requests =
        Array.isArray(data.requests)
          ? data.requests
          : [];

      const totalCash = users.reduce(
        function(total, user) {
          return total +
            (Number(user.cash) || 0);
        },
        0
      );

      document.getElementById(
        "userCount"
      ).textContent =
        users.length.toLocaleString("ja-JP") +
        "人";

      document.getElementById(
        "totalCash"
      ).textContent =
        totalCash.toLocaleString("ja-JP") +
        "円";

      document.getElementById(
        "pendingCount"
      ).textContent =
        pendingRequests.length
          .toLocaleString("ja-JP") +
        "件";

      document.getElementById(
        "updateStatus"
      ).textContent =
        "最終更新：" +
        new Date().toLocaleTimeString(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );

      renderPendingRequests(
        pendingRequests
      );

      renderUsers(users);
      renderHistory(requests);
    }

    function renderPendingRequests(requests) {
      const container =
        document.getElementById(
          "pendingContainer"
        );

      if (requests.length === 0) {
        container.innerHTML =
          '<div class="empty">' +
          "現在、承認待ちの申請はありません。" +
          "</div>";
        return;
      }

      container.innerHTML =
        requests.map(
          function(request) {
            const requestId =
              escapeHtml(
                request.requestId
              );

            return (
              '<article class="request-card">' +
                '<div class="request-head">' +
                  "<div>" +
                    '<div class="request-user">' +
                      escapeHtml(
                        request.userName
                      ) +
                      "さん" +
                    "</div>" +
                    '<div class="request-date">' +
                      escapeHtml(
                        request.date
                      ) +
                    "</div>" +
                  "</div>" +
                  '<div class="request-amount">' +
                    formatYen(
                      request.amount
                    ) +
                  "</div>" +
                "</div>" +
                '<div class="request-actions">' +
                  '<button class="action-button reject-button"' +
                    ' type="button"' +
                    ' data-request-id="' +
                      requestId +
                    '"' +
                    ' data-user-name="' +
                      escapeHtml(
                        request.userName
                      ) +
                    '"' +
                    ' data-amount="' +
                      Number(
                        request.amount
                      ) +
                    '"' +
                    ' onclick="rejectFromButton(this)">' +
                    "却下する" +
                  "</button>" +
                  '<button class="action-button approve-button"' +
                    ' type="button"' +
                    ' data-request-id="' +
                      requestId +
                    '"' +
                    ' data-user-name="' +
                      escapeHtml(
                        request.userName
                      ) +
                    '"' +
                    ' data-amount="' +
                      Number(
                        request.amount
                      ) +
                    '"' +
                    ' onclick="approveFromButton(this)">' +
                    "承認する" +
                  "</button>" +
                "</div>" +
              "</article>"
            );
          }
        ).join("");
    }

    function renderUsers(users) {
      const container =
        document.getElementById(
          "usersContainer"
        );

      if (users.length === 0) {
        container.innerHTML =
          '<div class="empty">' +
          "ユーザーが見つかりません。" +
          "</div>";
        return;
      }

      container.innerHTML =
        users.map(
          function(user) {
            return (
              '<div class="user-card">' +
                "<div>" +
                  '<div class="user-name">' +
                    escapeHtml(user.name) +
                  "</div>" +
                  '<div class="user-sub">' +
                    "利用可能：" +
                    formatYen(
                      user.availableCash
                    ) +
                    "<br>" +
                    "申請中：" +
                    formatYen(
                      user.pendingWithdrawal
                    ) +
                  "</div>" +
                "</div>" +
                '<div class="user-cash">' +
                  formatYen(user.cash) +
                "</div>" +
              "</div>"
            );
          }
        ).join("");
    }

    function renderHistory(requests) {
      const container =
        document.getElementById(
          "historyContainer"
        );

      if (requests.length === 0) {
        container.innerHTML =
          '<div class="empty">' +
          "出金申請の履歴はありません。" +
          "</div>";
        return;
      }

      container.innerHTML =
        requests.slice(0, 30).map(
          function(request) {
            const statusClass =
              getStatusClass(
                request.status
              );

            return (
              '<div class="history-row">' +
                "<div>" +
                  '<div class="history-main">' +
                    escapeHtml(
                      request.userName
                    ) +
                    "さん" +
                  "</div>" +
                  '<div class="history-sub">' +
                    escapeHtml(
                      request.date
                    ) +
                  "</div>" +
                "</div>" +
                '<div class="history-right">' +
                  '<div class="history-amount">' +
                    formatYen(
                      request.amount
                    ) +
                  "</div>" +
                  '<span class="status-chip ' +
                    statusClass +
                  '">' +
                    escapeHtml(
                      request.status
                    ) +
                  "</span>" +
                "</div>" +
              "</div>"
            );
          }
        ).join("");
    }

    function approveFromButton(button) {
      const requestId =
        button.dataset.requestId;

      const userName =
        button.dataset.userName;

      const amount =
        Number(button.dataset.amount) || 0;

      const confirmed = confirm(
        userName +
        "さんの出金申請 " +
        formatYen(amount) +
        " を承認しますか？\n\n" +
        "承認すると、パパ銀行残高から実際に差し引かれます。"
      );

      if (confirmed) {
        processRequest(
          "approveWithdrawalRequest",
          requestId,
          "承認"
        );
      }
    }

    function rejectFromButton(button) {
      const requestId =
        button.dataset.requestId;

      const userName =
        button.dataset.userName;

      const amount =
        Number(button.dataset.amount) || 0;

      const confirmed = confirm(
        userName +
        "さんの出金申請 " +
        formatYen(amount) +
        " を却下しますか？\n\n" +
        "残高は減らず、拘束されていた金額が利用可能額に戻ります。"
      );

      if (confirmed) {
        processRequest(
          "rejectWithdrawalRequest",
          requestId,
          "却下"
        );
      }
    }

    async function processRequest(
      action,
      requestId,
      actionLabel
    ) {
      if (processing) {
        return;
      }

      setProcessing(
        true,
        actionLabel + "処理中..."
      );

      try {
        const result = await callApi(
          action,
          {
            requestId: requestId
          }
        );

        alert(result.message);

        const newData = await callApi(
          "getParentData"
        );

        renderParentData(newData);

      } catch (error) {
        alert(
          actionLabel +
          "エラー\n\n" +
          getErrorMessage(error)
        );

      } finally {
        setProcessing(false);
      }
    }

    function logout() {
      parentPassword = "";

      document.getElementById(
        "parentView"
      ).style.display = "none";

      document.getElementById(
        "loginView"
      ).style.display = "block";

      hideLoginError();

      document.getElementById(
        "passwordInput"
      ).focus();
    }

    function setProcessing(active, message) {
      processing = active;

      const overlay =
        document.getElementById(
          "loadingOverlay"
        );

      if (active) {
        document.getElementById(
          "loadingMessage"
        ).textContent =
          message || "処理中...";

        overlay.style.display = "flex";
      } else {
        overlay.style.display = "none";
      }

      document.getElementById(
        "loginButton"
      ).disabled = active;

      document.getElementById(
        "reloadButton"
      ).disabled = active;
    }

    function showLoginError(message) {
      const element =
        document.getElementById(
          "loginError"
        );

      element.textContent = message;
      element.style.display = "block";
    }

    function hideLoginError() {
      document.getElementById(
        "loginError"
      ).style.display = "none";
    }

    function getStatusClass(status) {
      if (status === "承認済み") {
        return "status-approved";
      }

      if (
        status === "却下" ||
        status === "取消済み"
      ) {
        return "status-rejected";
      }

      if (status === "申請中") {
        return "status-pending";
      }

      return "";
    }

    function formatYen(value) {
      return (
        (Number(value) || 0)
          .toLocaleString("ja-JP") +
        "円"
      );
    }

    function getErrorMessage(error) {
      return error && error.message
        ? error.message
        : String(error);
    }

    function escapeHtml(value) {
      return String(
        value == null ? "" : value
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
