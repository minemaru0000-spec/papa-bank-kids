<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>峯松証券 キッズ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: #fef9f0;
    color: #333;
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, #ff9a56, #ffd56b);
    color: #fff;
    padding: 16px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .container { max-width: 480px; margin: 0 auto; padding: 12px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .cash-title { font-size: 14px; color: #888; }
  .cash-amount { font-size: 28px; font-weight: bold; color: #ff7a30; margin: 4px 0; }
  .sub-cash { font-size: 13px; color: #999; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #f0f0f0;
    font-weight: bold;
    cursor: pointer;
  }
  .tab-btn.active { background: #ff9a56; color: #fff; }
  .stock-list { display: flex; flex-direction: column; gap: 10px; }
  .stock-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .stock-name { font-weight: bold; font-size: 15px; }
  .stock-price { font-size: 14px; color: #555; }
  .stock-change.up { color: #e74c3c; }
  .stock-change.down { color: #3498db; }
  .btn-small {
    padding: 6px 10px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 4px;
  }
  .btn-buy { background: #ff7a30; color: #fff; }
  .btn-sell { background: #4a90d9; color: #fff; }
  .btn-buy:disabled, .btn-sell:disabled { background: #ccc; cursor: not-allowed; }
  .holding-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .action-row { display: flex; gap: 10px; margin-top: 10px; }
  .action-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
  }
  .btn-withdraw { background: #4a90d9; }
  .btn-deposit { background: #27ae60; }
  .pending-request-card {
    background: #fff8ee;
    border: 1px solid #ffe0b0;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .pending-request-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
  }
  .pending-request-date { font-size: 11px; color: #999; font-weight: normal; margin-top: 2px; }
  .btn-cancel-withdraw, .btn-cancel-deposit {
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  #login-screen {
    max-width: 480px;
    margin: 60px auto;
    padding: 24px;
    text-align: center;
  }
  #login-screen input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 12px;
  }
  #login-screen button {
    width: 100%;
    padding: 12px;
    background: #ff9a56;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    width: 88%;
    max-width: 360px;
  }
  .modal-box h3 { margin-top: 0; }
  .modal-box input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin: 10px 0;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  .modal-btn-cancel { background: #eee; color: #555; }
  .modal-btn-confirm { background: #ff7a30; color: #fff; }
  #loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.7);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    font-weight: bold;
    font-size: 16px;
  }
  #loading-overlay.show { display: flex; }
</style>
</head>
<body>

<div id="loading-overlay">読み込み中...</div>

<div id="login-screen">
  <h2>峯松証券 キッズ</h2>
  <p>お名前を入力してください</p>
  <input type="text" id="login-name-input" placeholder="なまえ">
  <button onclick="doLogin()">はじめる</button>
</div>

<div id="main-screen" style="display:none;">
  <header>峯松証券 キッズ 🏦</header>
  <div class="container">

    <div class="card">
      <div class="cash-title">つかえるお金</div>
      <div class="cash-amount" id="cash-amount">0円</div>
      <div class="sub-cash" id="sub-cash-info"></div>
      <div class="action-row">
        <button class="action-btn btn-withdraw" onclick="openWithdrawModal()">出金申請</button>
        <button class="action-btn btn-deposit" onclick="openDepositModal()">入金申請</button>
      </div>
    </div>

    <div class="card" id="pending-withdraw-area" style="display:none;">
      <div style="font-weight:bold; margin-bottom:8px;">出金申請中</div>
      <div id="pending-withdraw-list"></div>
    </div>

    <div class="card" id="pending-deposit-area" style="display:none;">
      <div style="font-weight:bold; margin-bottom:8px;">入金申請中</div>
      <div id="pending-deposit-list"></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" id="tab-market" onclick="switchTab('market')">マーケット</button>
        <button class="tab-btn" id="tab-holding" onclick="switchTab('holding')">保有銘柄</button>
      </div>
      <div id="market-view" class="stock-list"></div>
      <div id="holding-view" class="stock-list" style="display:none;"></div>
    </div>

  </div>
</div>

<div class="modal-overlay" id="withdraw-modal">
  <div class="modal-box">
    <h3>出金申請</h3>
    <p>いくら出金しますか？</p>
    <input type="number" id="withdraw-amount-input" placeholder="金額（円）">
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal('withdraw-modal')">やめる</button>
      <button class="modal-btn-confirm" onclick="submitWithdraw()">申請する</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deposit-modal">
  <div class="modal-box">
    <h3>入金申請</h3>
    <p>いくら入金しますか？</p>
    <input type="number" id="deposit-amount-input" placeholder="金額（円）">
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal('deposit-modal')">やめる</button>
      <button class="modal-btn-confirm" onclick="submitDeposit()">申請する</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="trade-modal">
  <div class="modal-box">
    <h3 id="trade-modal-title">売買</h3>
    <p id="trade-modal-desc"></p>
    <input type="number" id="trade-units-input" placeholder="数量">
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal('trade-modal')">やめる</button>
      <button class="modal-btn-confirm" onclick="submitTrade()">決定</button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // グローバル状態
  // ============================================================
  var API_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbxHXhW4qe6pWMHCgMlQi-2o3rk-3oVnxlUP9FTVD-tev_kpGzriSSQcq8DOyaHQvQZH/exec"; // ← 実際のGASデプロイURLに置き換えてください
  var myName = "";
  var appState = null;
  var currentTradeCode = "";
  var currentTradeType = "";
  var currentTradePrice = 0;

  function yen(n) {
    return Number(n || 0).toLocaleString("ja-JP") + "円";
  }

  function showLoading() {
    document.getElementById("loading-overlay").classList.add("show");
  }
  function hideLoading() {
    document.getElementById("loading-overlay").classList.remove("show");
  }

  function callApi(action, params) {
    showLoading();
    var body = Object.assign({ action: action }, params || {});
    return fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(body)
    })
      .then(function(res) { return res.json(); })
      .catch(function(err) {
        console.error(err);
        return { status: "error", message: "通信エラーが発生しました。" };
      })
      .finally(function() {
        hideLoading();
      });
  }

  // ============================================================
  // ログイン
  // ============================================================
  function doLogin() {
    var name = document.getElementById("login-name-input").value.trim();
    if (!name) {
      alert("なまえを入力してください");
      return;
    }
    myName = name;
    localStorage.setItem("kidsName", name);
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("main-screen").style.display = "block";
    loadData();
  }

  window.onload = function() {
    var savedName = localStorage.getItem("kidsName");
    if (savedName) {
      document.getElementById("login-name-input").value = savedName;
      myName = savedName;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("main-screen").style.display = "block";
      loadData();
    }
  };

  // ============================================================
  // データ読み込み・レンダリング
  // ============================================================
  function loadData() {
    callApi("getKidData", { userName: myName }).then(function(res) {
      if (res.status !== "success") {
        alert(res.message);
        return;
      }
      appState = res;
      renderCash();
      renderPendingWithdrawals();
      renderPendingDeposits();
      renderMarket();
      renderHoldings();
    });
  }

  function renderCash() {
    document.getElementById("cash-amount").innerText = yen(appState.user.availableCash);
    var info = "";
    if (appState.user.pendingWithdrawal > 0) {
      info += "出金申請中：" + yen(appState.user.pendingWithdrawal) + " ";
    }
    if (appState.user.pendingDeposit > 0) {
      info += "入金申請中：" + yen(appState.user.pendingDeposit);
    }
    document.getElementById("sub-cash-info").innerText = info;
  }

  function renderPendingWithdrawals() {
    var area = document.getElementById("pending-withdraw-area");
    var list = document.getElementById("pending-withdraw-list");
    var requests = appState && Array.isArray(appState.pendingWithdrawalRequests)
      ? appState.pendingWithdrawalRequests : [];

    if (requests.length === 0) {
      area.style.display = "none";
      return;
    }

    var html = "";
    requests.forEach(function(req) {
      html += '<div class="pending-request-card">' +
                '<div class="pending-request-main">' +
                  '<div>' + yen(req.amount) +
                    '<div class="pending-request-date">' + req.date + '</div>' +
                  '</div>' +
                  '<button class="btn-cancel-withdraw" data-id="' + req.requestId + '" data-amount="' + req.amount + '" onclick="askCancelWithdraw(this)">取消</button>' +
                '</div>' +
              '</div>';
    });
    list.innerHTML = html;
    area.style.display = "block";
  }

  function renderPendingDeposits() {
    var area = document.getElementById("pending-deposit-area");
    var list = document.getElementById("pending-deposit-list");
    var requests = appState && Array.isArray(appState.pendingDepositRequests)
      ? appState.pendingDepositRequests : [];

    if (requests.length === 0) {
      area.style.display = "none";
      return;
    }

    var html = "";
    requests.forEach(function(req) {
      html += '<div class="pending-request-card">' +
                '<div class="pending-request-main">' +
                  '<div>' + yen(req.amount) +
                    '<div class="pending-request-date">' + req.date + '</div>' +
                  '</div>' +
                  '<button class="btn-cancel-deposit" data-id="' + req.requestId + '" data-amount="' + req.amount + '" onclick="askCancelDeposit(this)">取消</button>' +
                '</div>' +
              '</div>';
    });
    list.innerHTML = html;
    area.style.display = "block";
  }

  function askCancelWithdraw(btn) {
    var amount = btn.dataset.amount;
    var requestId = btn.dataset.id;
    if (confirm(yen(amount) + "の出金申請を取り消しますか？")) {
      callApi("cancelWithdrawalRequest", { userName: myName, requestId: requestId }).then(function(res) {
        alert(res.message);
        if (res.status === "success") {
          loadData();
        }
      });
    }
  }

  function askCancelDeposit(btn) {
    var amount = btn.dataset.amount;
    var requestId = btn.dataset.id;
    if (confirm(yen(amount) + "の入金申請を取り消しますか？")) {
      callApi("cancelDepositRequest", { userName: myName, requestId: requestId }).then(function(res) {
        alert(res.message);
        if (res.status === "success") {
          loadData();
        }
      });
    }
  }

  // ============================================================
  // マーケット・保有銘柄
  // ============================================================
  function switchTab(tab) {
    document.getElementById("tab-market").classList.toggle("active", tab === "market");
    document.getElementById("tab-holding").classList.toggle("active", tab === "holding");
    document.getElementById("market-view").style.display = tab === "market" ? "flex" : "none";
    document.getElementById("holding-view").style.display = tab === "holding" ? "flex" : "none";
  }

  function renderMarket() {
    var view = document.getElementById("market-view");
    var list = (appState && Array.isArray(appState.market)) ? appState.market : [];
    var html = "";
    list.forEach(function(item) {
      var changeClass = item.change >= 0 ? "up" : "down";
      var changeSign = item.change >= 0 ? "+" : "";
      html += '<div class="stock-item">' +
                '<div>' +
                  '<div class="stock-name">' + item.name + '</div>' +
                  '<div class="stock-price">' + yen(item.price) +
                    ' <span class="stock-change ' + changeClass + '">' + changeSign + item.change + '%</span>' +
                  '</div>' +
                '</div>' +
                '<div>' +
                  '<button class="btn-small btn-buy" onclick="openTradeModal(\'' + item.code + '\',\'buy\',' + item.price + ',\'' + item.name + '\')">買う</button>' +
                  '<button class="btn-small btn-sell" onclick="openTradeModal(\'' + item.code + '\',\'sell\',' + item.price + ',\'' + item.name + '\')">売る</button>' +
                '</div>' +
              '</div>';
    });
    view.innerHTML = html || '<div style="text-align:center;color:#999;">銘柄情報がありません</div>';
  }

  function renderHoldings() {
    var view = document.getElementById("holding-view");
    var list = (appState && Array.isArray(appState.holdings)) ? appState.holdings : [];
    var html = "";
    list.forEach(function(item) {
      html += '<div class="holding-item">' +
                '<span>' + item.name + '（' + item.units + '）</span>' +
                '<span>' + yen(item.units * item.averagePrice) + '</span>' +
              '</div>';
    });
    view.innerHTML = html || '<div style="text-align:center;color:#999;">保有銘柄はありません</div>';
  }

  // ============================================================
  // モーダル操作
  // ============================================================
  function closeModal(id) {
    document.getElementById(id).classList.remove("show");
  }

  function openWithdrawModal() {
    document.getElementById("withdraw-amount-input").value = "";
    document.getElementById("withdraw-modal").classList.add("show");
  }

  function openDepositModal() {
    document.getElementById("deposit-amount-input").value = "";
    document.getElementById("deposit-modal").classList.add("show");
  }

  function submitWithdraw() {
    var amount = document.getElementById("withdraw-amount-input").value;
    if (!amount || Number(amount) <= 0) {
      alert("金額を入力してください");
      return;
    }
    callApi("requestCash", { userName: myName, amount: Number(amount) }).then(function(res) {
      alert(res.message);
      closeModal("withdraw-modal");
      if (res.status === "success") {
        loadData();
      }
    });
  }

  function submitDeposit() {
    var amount = document.getElementById("deposit-amount-input").value;
    if (!amount || Number(amount) <= 0) {
      alert("金額を入力してください");
      return;
    }
    callApi("requestDeposit", { userName: myName, amount: Number(amount) }).then(function(res) {
      alert(res.message);
      closeModal("deposit-modal");
      if (res.status === "success") {
        loadData();
      }
    });
  }

  function openTradeModal(code, type, price, name) {
    currentTradeCode = code;
    currentTradeType = type;
    currentTradePrice = price;
    document.getElementById("trade-modal-title").innerText = (type === "buy" ? "買う" : "売る") + "：" + name;
    document.getElementById("trade-modal-desc").innerText = "現在価格：" + yen(price);
    document.getElementById("trade-units-input").value = "";
    document.getElementById("trade-modal").classList.add("show");
  }

  function submitTrade() {
    var units = document.getElementById("trade-units-input").value;
    if (!units || Number(units) <= 0) {
      alert("数量を入力してください");
      return;
    }
    callApi("tradeStockByUnits", {
      userName: myName,
      code: currentTradeCode,
      tradeType: currentTradeType,
      units: Number(units)
    }).then(function(res) {
      alert(res.message);
      closeModal("trade-modal");
      if (res.status === "success") {
        loadData();
      }
    });
  }
</script>
</body>
</html>
